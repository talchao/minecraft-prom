    <link rel="stylesheet" href="./css/styles.css" />
    <link

    <link rel="stylesheet" href="./css/main.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=open_in_new,dark_mode,light_mode,arrow_forward" />

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
      // Check localStorage or system settings immediately before page rendering
      const savedTheme = localStorage.getItem("theme");
      const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

      if (savedTheme === "dark" || (!savedTheme && systemPrefersDark)) {
        document.documentElement.setAttribute("data-bs-theme", "dark");
      } else {
        document.documentElement.setAttribute("data-bs-theme", "light");
      }
    </script>

  <body>

            <div class="card col-lg-4 p-2 rounded-3 border-2 border-primary">
              <img class="rounded card-img-uniform" src="./assets/images/2026_hoco.png" />
              <div class="card-body p-0 pt-2">
                <div class="d-flex p-1">
                  <div class="card-text font-monospace">
                    <p class="mb-0">Minecraft Homecoming</p>
                    <p class="mb-0">October 2026</p>
                  </div>
                  <span class="ms-auto material-symbols-outlined"> arrow_forward </span>
                </div>
              </div>
              <a href="changelog.html#hoco26" class="stretched-link"></a>
            </div>
            <div class="card col-lg-4 p-2 rounded-3 border-2 border-primary">
              <img class="rounded card-img-uniform" src="./assets/images/2026_prom.png" />
              <div class="card-body p-0 pt-2">
                <div class="d-flex p-1">
                  <div class="card-text font-monospace">
                    <p class="mb-0">Minecraft Prom</p>
                    <p class="mb-0">April 2026</p>
                  </div>
                  <span class="ms-auto material-symbols-outlined"> arrow_forward </span>
                </div>
              </div>
              <a href="changelog.html#prom26" class="stretched-link"></a>
            </div>

    <footer class="bg-dark text-center text-white pt-3 pb-4">
      <div class="justify-content-center form-switch ms-auto">
        <input class="form-check-input hidden" type="checkbox" id="darkModeToggle" />
        <label class="form-check-label" for="darkModeToggle">
          <span class="material-symbols-outlined"> dark_mode </span>
          <!-- <span class="material-symbols-outlined"> light_mode </span> -->

    </footer>

    <script src="./main.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Timer Script -->
    <script>
      let interval
      const eventDay = new Date("2026-10-24T00:00:00Z")   // October 24, 2026 @ 7PM CST / 12AM UTC

      const second = 1000
      const minute = second * 60
      const hour = minute * 60
      const day = hour * 24
      const month = day * 30

      const countdown = () => {
        const now = new Date()
        const timeSpan = eventDay - now

        if (timeSpan < 0) {
          clearInterval(interval)
          document.getElementById("timer").innerHTML = "<h2>Homecoming has started!</h2>"
          return
        }

        let monthDisplay = Math.floor(timeSpan / month)
        if (monthDisplay / 10 < 1) monthDisplay = "0" + monthDisplay

        let dayDisplay = Math.floor((timeSpan % month) / day)
        if (dayDisplay / 10 < 1) dayDisplay = "0" + dayDisplay

        let hourDisplay = Math.floor((timeSpan % day) / hour)
        if (hourDisplay / 10 < 1) hourDisplay = "0" + hourDisplay

        let minuteDisplay = Math.floor((timeSpan % hour) / minute)
        if (minuteDisplay / 10 < 1) minuteDisplay = "0" + minuteDisplay

        let secondDisplay = Math.floor((timeSpan % minute) / second)
        if (secondDisplay / 10 < 1) secondDisplay = "0" + secondDisplay

        document.getElementById("month").innerHTML = monthDisplay
        document.getElementById("day").innerHTML = dayDisplay
        document.getElementById("hour").innerHTML = hourDisplay
        document.getElementById("minute").innerHTML = minuteDisplay
        document.getElementById("second").innerHTML = secondDisplay
      }

      countdown()
      interval = setInterval(countdown, 1000)
    </script>
    <!-- Dark Mode Toggle Script -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const toggle = document.getElementById("darkModeToggle");
        const html = document.documentElement;

        // Sync the checkbox switch state with the current active theme
        const activeTheme = html.getAttribute("data-bs-theme");
        toggle.checked = activeTheme === "dark";

        // Listen for toggle switch changes
        toggle.addEventListener("change", function () {
          if (this.checked) {
            html.setAttribute("data-bs-theme", "dark");
            localStorage.setItem("theme", "dark");
          } else {
            html.setAttribute("data-bs-theme", "light");
            localStorage.setItem("theme", "light");
          }
        });
      });
    </script>
  </body>
